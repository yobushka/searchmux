name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Test
        run: go test -race -count=1 ./...

      - name: Vet
        run: go vet ./...

  build:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -ldflags="-s -w" -o searchmux-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/searchmux

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: searchmux-${{ matrix.goos }}-${{ matrix.goarch }}
          path: searchmux-${{ matrix.goos }}-${{ matrix.goarch }}
