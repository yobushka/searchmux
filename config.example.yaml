listen: ":8080"

auth:
  token_hashes:
    - ${GATEWAY_TOKEN_SHA256}

defaults:
  timeout: 5s
  max_results: 10

providers:
  - name: tavily
    tier: 1
    rate_limit:
      requests: 1000
      window: 720h  # 30 days
    timeout: 3s

  - name: brave
    tier: 1
    rate_limit:
      requests: 2000
      window: 720h
    timeout: 3s

  - name: serper
    tier: 1
    rate_limit:
      requests: 2500
      window: 720h
    timeout: 3s

  - name: exa
    tier: 1
    timeout: 5s

  - name: jina
    tier: 1
    timeout: 5s

  - name: searxng
    tier: 2
    api_base: http://searxng:8888
    timeout: 5s

routing:
  strategy: round-robin

circuit_breaker:
  threshold: 3
  window: 60s
  cooldown: 30s

metrics:
  enabled: true
  path: /metrics
