services:
  searchmux:
    image: yobushka/searchmux:latest
    container_name: searchmux
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      TAVILY_API_KEY: "${TAVILY_API_KEY}"
      BRAVE_API_KEY: "${BRAVE_API_KEY}"
      SERPER_API_KEY: "${SERPER_API_KEY}"
    volumes:
      - ./config.example.yaml:/etc/searchmux/config.yaml:ro
    restart: unless-stopped
