services:
  searchmux:
    build:
      context: .
      args:
        TARGETARCH: ${TARGETARCH:-amd64}
    container_name: searchmux
    ports:
      - "8080:8080"
    environment:
      GATEWAY_TOKEN_SHA256: "${GATEWAY_TOKEN_SHA256}"
    volumes:
      - ./config.example.yaml:/etc/searchmux/config.yaml:ro
    restart: unless-stopped
